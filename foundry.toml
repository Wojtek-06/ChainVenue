[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "./python" }]

# Gas reporting for lab + AMM hot paths
gas_reports = ["ConstantProductAMM", "EvmStorageLab", "EvmMemoryLab", "AtomicArbExecutor", "CrossVenueAdapter"]

[profile.default.fuzz]
runs = 256

[profile.ci]
ffi = false

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 64
depth = 32

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
