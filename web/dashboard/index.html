<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChainVenue — hedge metrics</title>
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a2332;
      --ink: #e7eef7;
      --muted: #8aa0b8;
      --accent: #3d9b8f;
      --warn: #c4a35a;
      --bad: #c45c5c;
      --line: rgba(231, 238, 247, 0.12);
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --font-body: "Segoe UI", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(61, 155, 143, 0.22), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(196, 163, 90, 0.12), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #121820);
    }
    header {
      padding: 2.5rem 1.5rem 1rem;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2rem, 4vw, 2.75rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
    }
    .lede { color: var(--muted); max-width: 40rem; line-height: 1.45; margin: 0; }
    main { max-width: 960px; margin: 0 auto; padding: 0 1.5rem 3rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
      margin: 1.5rem 0 1rem;
    }
    button, label.file {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0.45rem 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover, label.file:hover { border-color: var(--accent); color: #fff; }
    input[type="file"] { display: none; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }
    th, td {
      text-align: left;
      padding: 0.65rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .pos { color: var(--accent); }
    .neg { color: var(--bad); }
    .skip { color: var(--warn); }
    .empty {
      padding: 2rem 0;
      color: var(--muted);
      line-height: 1.5;
    }
    code { font-size: 0.85em; color: #b8d4c8; }
  </style>
</head>
<body>
  <header>
    <h1>ChainVenue</h1>
    <p class="lede">Offline hedge metrics ledger — basis, gross vs fair, gas-net. Load <code>metrics_ledger.json</code> or the bundled sample.</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="loadSample">Load sample ledger</button>
      <label class="file">Open JSON<input type="file" id="file" accept="application/json,.json" /></label>
      <span class="meta" id="status">No ledger loaded.</span>
    </div>
    <div id="content" class="empty">
      Generate with:<br />
      <code>cd python && python demo/e2e_hedge.py ledger --out ../web/dashboard/metrics_ledger.json --no-native</code>
    </div>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("content");

    function fmtInt(n) {
      if (n === undefined || n === null) return "—";
      const s = String(n);
      if (s.length > 18) return s.slice(0, 10) + "…";
      return s;
    }

    function render(ledger) {
      const rows = ledger.runs || ledger;
      if (!Array.isArray(rows) || rows.length === 0) {
        contentEl.className = "empty";
        contentEl.textContent = "Ledger has no runs.";
        return;
      }
      statusEl.textContent = `${rows.length} runs · generated ${ledger.generated_at || "n/a"}`;
      const html = [
        "<table><thead><tr>",
        "<th>Mid</th><th>Source</th><th>Hedge</th><th>Basis bps</th>",
        "<th>Gross vs fair</th><th>Gas</th><th>Net</th><th>Reason</th>",
        "</tr></thead><tbody>",
      ];
      for (const r of rows) {
        const netCls = r.should_hedge
          ? (r.net_profit_vs_fair > 0 ? "pos" : "neg")
          : "skip";
        html.push("<tr>");
        html.push(`<td>${r.mid_float ?? (Number(r.mid) / 1e18).toFixed(4)}</td>`);
        html.push(`<td>${r.source || "—"}</td>`);
        html.push(`<td class="${r.should_hedge ? "pos" : "skip"}">${r.should_hedge ? "yes" : "skip"}</td>`);
        html.push(`<td>${r.basis_bps}</td>`);
        html.push(`<td class="${r.profit_vs_fair > 0 ? "pos" : ""}">${fmtInt(r.profit_vs_fair)}</td>`);
        html.push(`<td>${fmtInt(r.gas_cost_wei)}</td>`);
        html.push(`<td class="${netCls}">${fmtInt(r.net_profit_vs_fair)}</td>`);
        html.push(`<td>${r.reason || ""}</td>`);
        html.push("</tr>");
      }
      html.push("</tbody></table>");
      contentEl.className = "";
      contentEl.innerHTML = html.join("");
    }

    async function loadSample() {
      try {
        const res = await fetch("metrics_ledger.json", { cache: "no-store" });
        if (!res.ok) throw new Error(res.statusText);
        render(await res.json());
      } catch (e) {
        statusEl.textContent = "Sample missing — generate ledger or open a file.";
        contentEl.className = "empty";
        contentEl.textContent = String(e.message || e);
      }
    }

    document.getElementById("loadSample").addEventListener("click", loadSample);
    document.getElementById("file").addEventListener("change", async (ev) => {
      const f = ev.target.files?.[0];
      if (!f) return;
      render(JSON.parse(await f.text()));
    });

    loadSample();
  </script>
</body>
</html>
